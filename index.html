<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cuatrocientos</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuatrocientos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:title" content="CUATROCIENTOS">
<meta property="og:description" content="Cuesta lo que pesa. Catálogo de camisetas de alto gramaje.">
<meta property="og:image" content="og.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
/* Concepto: una sola pantalla, como una tienda de ropa colgada. Bienvenida con percha que gira, riel, vista de prenda con etiquetas de color, ficha de pedido. */
:root{
  --blanco:#FFFFFF; --negro:#000000; --perla:#E5E5E5; --linea:#CFCFCF;
  --carmin:#9B1B1B; --carmin-claro:#C23A3A; --texto2:#444444;
  --display:'Archivo','Arial Narrow',Arial,sans-serif; --cuerpo:'Inter',system-ui,sans-serif;
  --franja:34px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body::before,.capa::before{content:"";position:fixed;inset:-24px;z-index:-1;background:url(fondo.jpg) center/cover no-repeat;filter:blur(2.5px) brightness(1.05);pointer-events:none}
@media (max-aspect-ratio:1/1){body::before,.capa::before{background:url(fondo.jpg) center 42%/100% auto no-repeat,url(fondo.jpg) center/cover no-repeat}}
.capa::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(248,248,248,.52),rgba(240,240,240,.62));pointer-events:none}
.luz{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:linear-gradient(180deg,rgba(248,248,248,.52),rgba(240,240,240,.62))}
body{margin:0;background:radial-gradient(120% 90% at 50% 38%,#fff 0%,#f6f6f6 60%,#ececec 100%);color:var(--negro);font-family:var(--cuerpo);font-size:15px;line-height:1.5;overflow:hidden}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--carmin);outline-offset:3px}
.lbl{font-family:var(--display);font-stretch:125%;font-weight:600;font-size:11px;letter-spacing:.22em;text-transform:uppercase}
.gut{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

/* franja inferior */
.franja{position:fixed;left:0;right:0;bottom:0;height:calc(var(--franja) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--carmin);color:var(--blanco);z-index:60;overflow:hidden;display:flex;align-items:center;white-space:nowrap}
.franja-pista{display:flex;flex-shrink:0;animation:franja 40s linear infinite}
.franja-pista span{padding-right:34px}
@keyframes franja{to{transform:translateX(-50%)}}

/* app */
.app{height:100%;display:flex;flex-direction:column;padding-bottom:calc(var(--franja) + env(safe-area-inset-bottom,0px))}
.sup{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:76px;padding-top:max(8px,env(safe-area-inset-top,0px))}
.sup button.txt{background:none;border:0;padding:10px 0;justify-self:start}
.sup button.txt.der{justify-self:end}
.sup .txt:hover{text-decoration:underline;text-underline-offset:5px;text-decoration-color:var(--carmin)}
.marca-sup{display:flex;align-items:center;gap:10px}
.sup .mi{height:52px;width:auto}
.sup .mp{height:38px;width:auto}
.escena{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-bottom:10px}
.riel-wrap{width:min(1100px,100%)}
.carril{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding:0 4px 8px}
.carril::-webkit-scrollbar{display:none}
.fila{position:relative;display:flex;justify-content:space-evenly;justify-content:safe space-evenly;gap:clamp(18px,2.6vw,40px);padding-left:clamp(10px,2vw,30px);padding-right:clamp(10px,2vw,30px);width:max-content;min-width:100%;padding-top:2px}
.fila::before{content:"";position:absolute;left:0;right:0;top:15px;height:5px;border-radius:3px;background:linear-gradient(#fafafa,#9a9a9a 55%,#666);box-shadow:0 2px 3px rgba(0,0,0,.22)}
.colgante{flex:0 0 clamp(190px,23vw,290px);width:clamp(190px,23vw,290px);background:none;border:0;padding:0;position:relative;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;align-self:flex-start;transform-origin:50% 0;animation:cae .9s cubic-bezier(.2,.8,.2,1) both,sway 7s ease-in-out infinite;animation-delay:calc(var(--i) * 90ms + .25s),calc(var(--i) * -1.1s);}
.fuera .colgante{animation-play-state:paused,paused;opacity:0}
@keyframes cae{from{transform:translateY(-70%);opacity:0}to{transform:none;opacity:1}}
@keyframes sway{0%,100%{transform:rotate(-.9deg)}50%{transform:rotate(.9deg)}}
.giro{position:relative;transform-style:preserve-3d;transform:perspective(900px) rotateY(0deg);transition:transform .95s cubic-bezier(.55,0,.2,1);transform-origin:50% 0}
.giro.vuelta{transform:perspective(900px) rotateY(180deg)}
.cara{display:flex;flex-direction:column;align-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cara.e{position:absolute;inset:0;transform:rotateY(180deg)}
.percha{width:60%;height:auto;margin-bottom:-13%;position:relative;z-index:2;overflow:visible}
.media{display:block;width:100%;aspect-ratio:var(--ar,10/13.4)}
.media{position:relative}
.media svg{width:100%;height:100%;display:block}
.media img.foto{position:absolute;inset:0;width:100%;height:100%;display:block}
.colgante .media svg{filter:drop-shadow(0 12px 8px rgba(0,0,0,.14))}
.media img.foto{object-fit:contain;object-position:50% 0;filter:drop-shadow(0 14px 10px rgba(0,0,0,.18))}
@media (hover:hover){.colgante:hover .giro{transform:perspective(900px) rotateY(180deg)}}
.pie-escena{width:min(1100px,100%);display:flex;justify-content:flex-end;min-height:20px;font-size:12px;color:var(--texto2);letter-spacing:.02em}
.pie-escena span{text-align:right}
.pie-escena b{color:var(--negro);font-weight:600}
.pill{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 28px;border:1px solid var(--negro);border-radius:999px;background:transparent;font-family:var(--display);font-stretch:125%;font-weight:600;font-size:11px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;color:var(--negro);transition:background .2s,color .2s}
.pill:hover{background:var(--negro);color:var(--blanco)}
.pill.solido{background:var(--negro);color:var(--blanco)}
.pill.solido:hover{background:var(--carmin);border-color:var(--carmin)}
.pill.wa{background:var(--carmin);color:var(--blanco);border-color:var(--carmin)}
.pill.wa:hover{background:#7e1515;border-color:#7e1515}
.pill[disabled],.pill[aria-disabled="true"]{opacity:.4;pointer-events:none}

/* bienvenida */
.bienvenida{position:fixed;inset:0;z-index:100;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.bienvenida::before,.bienvenida::after{content:"";position:absolute;top:0;bottom:0;width:50.4%;z-index:-1;background:var(--blanco);transition:transform 1.25s cubic-bezier(.76,0,.18,1);
  background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.045) 0 1px,transparent 1px 34px,rgba(0,0,0,.03) 34px 35px,transparent 35px 70px)}
.bienvenida::before{left:0;box-shadow:inset -14px 0 22px -14px rgba(0,0,0,.28)}
.bienvenida::after{right:0;box-shadow:inset 14px 0 22px -14px rgba(0,0,0,.28)}
.bienvenida>*{transition:opacity .45s ease,transform .6s ease}
.bienvenida.sale{pointer-events:none}
.bienvenida.sale>*{opacity:0!important;transform:scale(1.06)!important;animation:none!important}
.bienvenida.sale::before{transform:translateX(-102%)}
.bienvenida.sale::after{transform:translateX(102%)}
.bienvenida .bv-icono{width:auto;height:clamp(130px,25vh,230px);animation:bv-entra 1s cubic-bezier(.2,.8,.2,1) both}
.bienvenida .palabra{height:clamp(62px,11vh,104px);width:auto;animation:bv-entra 1s .18s cubic-bezier(.2,.8,.2,1) both}
.bienvenida .bv-eslogan{font-family:var(--cuerpo);font-weight:300;font-size:clamp(13px,1.9vh,17px);letter-spacing:.34em;text-indent:.34em;color:var(--negro);animation:bv-entra 1s .36s cubic-bezier(.2,.8,.2,1) both}
.bienvenida .carga{margin-top:6px}
@keyframes bv-entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.bienvenida .carga{width:140px;height:2px;background:var(--perla);overflow:hidden}
.bienvenida .carga i{display:block;height:100%;width:100%;background:var(--carmin);transform-origin:0 50%;animation:carga 4.6s linear both}
@keyframes carga{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* vista de prenda */
.capa{position:fixed;inset:0;z-index:40;isolation:isolate;background:#e9e9e9;display:none;flex-direction:column;padding-bottom:calc(var(--franja) + env(safe-area-inset-bottom,0px))}
.capa.abierta{display:flex;animation:aparece .45s ease both}
@keyframes aparece{from{opacity:0}to{opacity:1}}
.capa .cerrar{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:max(18px,env(safe-area-inset-right,0px));background:none;border:0;padding:10px 4px;z-index:5}
.capa .cerrar:hover{text-decoration:underline;text-underline-offset:5px;text-decoration-color:var(--carmin)}
.escenario{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;container-type:size}
.foco{position:relative;width:calc(var(--k,1) * max(120px,min(88cqw,calc((100cqh - 60px)/1.62))));z-index:3}
@supports not (width:1cqw){.foco{width:calc(var(--k,1) * clamp(190px,min(54vh,calc((100vh - 270px)/1.62)),600px))}}
.foco{align-self:flex-start;margin-top:40px}
.foco .giro,#f-giro .giro,.det{cursor:zoom-in}
.foco img.foto,.ficha img.foto{transform:none!important}
.ficha-img .seg{position:relative;z-index:6}
.foco .percha{width:46%;margin-bottom:-9%}
.foco .media svg{filter:drop-shadow(0 20px 14px rgba(0,0,0,.2))}
.foco.entra-der{animation:desliza-der .55s cubic-bezier(.2,.8,.2,1) both}
.foco.entra-izq{animation:desliza-izq .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes desliza-der{from{opacity:0;transform:translateX(70px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes desliza-izq{from{opacity:0;transform:translateX(-70px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.fantasma{position:absolute;top:50%;width:clamp(120px,22vh,210px);opacity:.28;filter:blur(9px);transform:translateY(-52%);pointer-events:none;z-index:1}
.fantasma.i{left:calc(50% - clamp(260px,34vw,470px))}
.fantasma.d{right:calc(50% - clamp(260px,34vw,470px))}
.etiquetas{position:absolute;left:calc(50% + clamp(100px,17vh,170px));top:calc(50% - clamp(150px,24vh,230px));display:flex;gap:12px;z-index:4}
.etq{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;transform-origin:50% 0;animation:sway 5s ease-in-out infinite;animation-delay:calc(var(--k) * -1.3s)}
.etq:hover,.etq:focus-visible{animation:balanceo 1s ease-in-out}
@keyframes balanceo{0%,100%{transform:rotate(0)}30%{transform:rotate(7deg)}65%{transform:rotate(-5deg)}}
.etq .hilo{width:1px;height:clamp(26px,5vh,52px);background:#777}
.etq .papel{width:30px;height:74px;border-radius:5px;border:1px solid #111;position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;box-shadow:0 5px 8px rgba(0,0,0,.2);clip-path:polygon(0 12px,10px 0,calc(100% - 10px) 0,100% 12px,100% 100%,0 100%)}
.etq .papel::before{content:"";position:absolute;top:7px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#e9e9e9;border:1px solid #777}
.etq .papel span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--display);font-stretch:125%;font-weight:700;font-size:8px;letter-spacing:.16em;text-transform:uppercase}
.etq[aria-pressed="true"] .papel{outline:2px solid var(--carmin);outline-offset:2px}
.flecha{position:absolute;top:50%;margin-top:-22px;width:44px;height:44px;border-radius:50%;border:1px solid var(--negro);background:var(--blanco);display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;z-index:5}
.flecha:hover{background:var(--negro);color:var(--blanco)}
.flecha.i{left:max(18px,calc(env(safe-area-inset-left,0px) + 14px))}
.flecha.d{right:max(18px,calc(env(safe-area-inset-right,0px) + 14px))}
.titulo-area{display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 18px 16px;text-align:center}
.titulo-area h2{margin:0;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:clamp(17px,2.4vw,24px);letter-spacing:.06em;text-transform:uppercase;line-height:1.1}
.titulo-area .sub{font-size:12px;color:var(--texto2);margin-top:-6px}
.seg{display:inline-flex;border:1px solid var(--negro);border-radius:999px;padding:3px;gap:2px;background:var(--blanco)}
.seg button{min-height:34px;padding:0 18px;border:0;border-radius:999px;background:transparent;font-family:var(--display);font-stretch:125%;font-weight:700;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
.seg button[aria-pressed="true"]{background:var(--negro);color:var(--blanco)}
.seg button[hidden]{display:none}
.modo-det #etiquetas{opacity:0;pointer-events:none}
.det-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.det{width:max(150px,min(100%,calc(100cqh - 200px),520px));aspect-ratio:1/1;overflow:hidden;background:#111;cursor:zoom-in;border:1px solid var(--negro);position:relative}
.det img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease;transform-origin:50% 50%;user-select:none;-webkit-user-drag:none}
.s-pts{display:flex;justify-content:center;gap:2px;margin:2px 0 0}
.s-pts button{width:22px;height:22px;padding:0;border:0;background:none;position:relative;cursor:pointer}
.s-pts button::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--texto2);opacity:.4;transition:opacity .2s,transform .2s}
.s-pts button[aria-pressed="true"]::after{opacity:1;background:var(--carmin);transform:scale(1.35)}
.foco,#f-giro{touch-action:pan-y}
@keyframes sl-d{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes sl-i{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
.foco.an-d>*,#f-giro.an-d>*{animation:sl-d .28s ease-out}
.foco.an-i>*,#f-giro.an-i>*{animation:sl-i .28s ease-out}
@media (prefers-reduced-motion:reduce){.foco.an-d>*,.foco.an-i>*,#f-giro.an-d>*,#f-giro.an-i>*{animation:none}}
.det.zoom{cursor:zoom-out}
.det.zoom img{transform:scale(2.2)}
.det-txt{margin:0;font-size:13px;text-align:center;color:var(--texto2);max-width:44ch}
.det-ayuda{font-family:var(--display);font-stretch:125%;font-weight:600;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--texto2)}
.det-nav{display:flex;gap:8px}
.det-th{width:52px;height:52px;padding:0;border:1px solid var(--negro);background:#111;opacity:.55;overflow:hidden}
.det-th[aria-pressed="true"]{opacity:1;outline:2px solid var(--carmin);outline-offset:2px}
.det-th img{width:100%;height:100%;object-fit:cover;display:block}
@media (prefers-reduced-motion:reduce){.det img{transition:none}}
.zoomer{z-index:70;background:#e9e9e9}
.zoomer::before,.zoomer::after{display:none}
.z-vista{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;cursor:grab;margin:52px 0 8px}
.z-vista:active{cursor:grabbing}
.z-vista img{position:absolute;left:50%;top:50%;max-width:96%;max-height:96%;width:auto;height:auto;transform-origin:0 0;user-select:none;-webkit-user-drag:none;will-change:transform;filter:drop-shadow(0 10px 14px rgba(0,0,0,.2))}
.z-barra{display:flex;justify-content:center;align-items:center;gap:10px;padding:6px 16px 4px}
.z-barra button{min-width:46px;min-height:46px;border:1px solid var(--negro);border-radius:999px;background:var(--blanco);font-family:var(--display);font-stretch:125%;font-weight:700;font-size:14px;padding:0 16px}
.z-barra button:hover{background:var(--negro);color:var(--blanco)}
.z-ayuda{text-align:center;font-size:11px;color:var(--texto2);padding:2px 12px 12px}
.acc-fila{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}
.enlace{background:none;border:0;padding:6px 2px;font-family:var(--display);font-stretch:125%;font-weight:600;font-size:10px;letter-spacing:.2em;text-transform:uppercase;border-bottom:1px solid var(--negro)}
.enlace:hover{color:var(--carmin);border-color:var(--carmin)}

/* ficha */
.ficha{z-index:45;background:var(--blanco);overflow:auto}
.ficha-grid{flex:1;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);min-height:0}
.ficha-img{background:var(--perla);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:60px 24px 24px;min-height:0}
.ficha-img .giro{width:calc(var(--k,1) * clamp(190px,min(46vh,calc((100vh - 300px)/1.62)),440px))}
.ficha-img .seg{order:-1}
.ficha-img .det{width:clamp(180px,min(52vh,calc(100vh - 340px)),520px)}
.ficha::before,.ficha::after{display:none}
.ficha-der{padding:64px max(28px,env(safe-area-inset-right,0px)) 28px 36px;display:flex;flex-direction:column;gap:16px;overflow:auto;min-width:0}
.ficha-der h3{margin:0;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:clamp(22px,3vw,32px);letter-spacing:.06em;text-transform:uppercase;line-height:1.05}
.badge{display:inline-block;background:var(--negro);color:var(--blanco);font-family:var(--display);font-stretch:125%;font-weight:700;font-size:11px;letter-spacing:.12em;padding:3px 9px}
.precio{font-family:var(--display);font-stretch:125%;font-weight:700;font-size:24px}
.ficha-der p{margin:0;color:var(--texto2)}
.dato{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;font-size:14px;border-top:1px solid var(--linea);padding-top:12px;align-items:center}
.dato>b{font-family:var(--display);font-stretch:125%;font-weight:600;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
.opciones{display:flex;flex-wrap:wrap;gap:8px}
.op{min-width:52px;min-height:44px;padding:0 14px;border:1px solid var(--negro);background:var(--blanco);font-family:var(--display);font-stretch:125%;font-weight:700;font-size:12px;letter-spacing:.06em}
.op[aria-pressed="true"]{background:var(--negro);color:var(--blanco)}
.op small{display:block;font-family:var(--cuerpo);font-weight:500;font-size:9px;letter-spacing:.04em;text-transform:none;margin-top:2px;opacity:.85}
#f-tallas .op{line-height:1.1;padding-top:4px;padding-bottom:4px}
#f-tallas .op[data-e="ultimas"] small{color:var(--carmin)}
#f-tallas .op[aria-pressed="true"][data-e="ultimas"] small{color:#ffb4b4}
.op[disabled]{opacity:.38;cursor:not-allowed;text-decoration:line-through;text-decoration-thickness:1px}
.op[disabled] small{text-decoration:none}
.op.col{display:inline-flex;align-items:center;gap:8px}
.op.col i{width:14px;height:14px;border-radius:50%;border:1px solid #888;display:block}
.cant{display:inline-flex;align-items:center;border:1px solid var(--negro);justify-self:start}
.cant button{width:44px;height:44px;border:0;background:var(--blanco);font-size:20px}
.cant button:hover{background:var(--perla)}
.cant output{min-width:44px;text-align:center;font-family:var(--display);font-weight:700}
.acciones{display:flex;flex-direction:column;gap:10px}
.aviso{font-size:12px;color:var(--texto2)}
.msg{font-size:12px;color:var(--carmin);min-height:16px}
.lista-pts{margin:0;padding-left:18px;color:var(--texto2);font-size:13px}

/* paneles */
.vel{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);display:none}
.vel.abierto{display:block}
.panel{position:fixed;z-index:71;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100% - 80px);overflow:auto;background:var(--blanco);border:1px solid var(--negro);padding:28px;display:none}
.panel.abierto{display:block}
.panel h3{margin:6px 0 10px;font-family:var(--display);font-stretch:125%;font-weight:300;font-size:26px;letter-spacing:.05em;text-transform:uppercase;line-height:1.1}
.panel p{margin:0 0 12px;color:var(--texto2)}
.panel .x{float:right;background:none;border:1px solid var(--negro);min-height:36px;padding:0 12px;font-family:var(--display);font-stretch:125%;font-weight:600;font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.barra{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;align-items:start;margin-top:14px}
.barra .g{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:19px}
.barra .g small{font-size:10px;font-weight:600;letter-spacing:.1em}
.barra .pista{background:var(--perla);height:14px;margin-top:8px}
.barra .txt{display:block;margin-top:6px;font-size:13.5px;line-height:1.35;color:var(--texto2)}
.barra .rel{height:100%;background:var(--negro);width:0;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.barra:first-of-type .rel{background:var(--carmin)}
.pasos{display:grid;gap:10px;margin:14px 0 4px}
.pasos div{border-top:2px solid var(--negro);padding-top:8px;font-size:13px;color:var(--texto2)}
.pasos b{display:block;color:var(--negro);font-family:var(--display);font-stretch:125%;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.num{display:inline-block;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.04em;border:1px solid var(--negro);padding:8px 14px;user-select:all;margin:4px 0 12px}

/* pedido */
.bp{position:fixed;left:0;right:0;bottom:calc(var(--franja) + env(safe-area-inset-bottom,0px));z-index:65;background:var(--negro);color:var(--blanco);transform:translateY(120%);visibility:hidden;transition:transform .3s,visibility .3s}
.bp.visible{transform:none;visibility:visible}
.bp-fila{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding-top:6px;padding-bottom:6px}
.bp button.ver{background:none;border:0;color:var(--blanco);text-align:left}
.bp .pill{border-color:var(--blanco);color:var(--blanco);min-height:40px;padding:0 20px}
.bp .pill:hover{background:var(--blanco);color:var(--negro)}
.lista{max-height:36vh;overflow:auto;border-bottom:1px solid #333}
.lista[hidden]{display:none}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #2a2a2a;font-size:13px}
.item button{background:none;border:1px solid #666;color:var(--blanco);min-height:32px;padding:0 12px;font-size:12px}

@media (max-width:860px){
  .colgante{flex-basis:200px;width:200px}
  .fantasma{display:none}
  .etiquetas{left:auto;right:max(14px,env(safe-area-inset-right,0px));top:12%}
  .flecha{top:auto;bottom:12px;margin:0}
  .ficha-grid{grid-template-columns:1fr;display:block}
  .ficha-img{padding:56px 16px 20px}
  .ficha-der{padding:20px 18px 24px}
  .sup{min-height:68px}
}
@media (max-height:640px){
  .sup{min-height:58px}.sup img{height:40px}
  .titulo-area{gap:8px;padding-bottom:10px}
}
@media (prefers-reduced-motion:reduce){
  .franja-pista,.colgante,.etq,.bienvenida .bv-icono,.bienvenida .palabra,.bienvenida .bv-eslogan,.bienvenida .carga i{animation:none!important}
  .fuera .colgante{opacity:1}
  .giro,.bienvenida,.barra .rel,.bp{transition:none}
  .foco.entra-der,.foco.entra-izq,.capa.abierta{animation:none}
}

[hidden]{display:none!important}
/* ===== sección Polos: otro fondo, serifa y dorado ===== */

@media (max-width:520px){.tit-polos span{letter-spacing:.14em;font-size:9px;white-space:nowrap}.polos .lbl{letter-spacing:.12em}}

/* v18: una percha por color, prendas del mismo tamaño, vista de prenda sin percha */
.carril{scroll-snap-type:x proximity}
.colgante{scroll-snap-align:center}
.foco .percha,.fantasma .percha,.ficha .percha{display:none}

.modo-det .det-wrap{gap:7px}

/* ---- v26: perchas con vida, bienvenida con contador, fondo vivo, historias ---- */
/* A */
.colgante{rotate:calc(var(--vel,0) * 1deg);transition:rotate .8s cubic-bezier(.2,1.9,.45,1)}
.colgante.elegida{animation:elige .52s cubic-bezier(.3,1.3,.5,1) both;z-index:4}
@keyframes elige{0%{transform:rotate(0) scale(1)}28%{transform:rotate(-8deg) scale(1.03)}58%{transform:rotate(6deg) scale(1.11)}100%{transform:rotate(0) scale(1.18)}}
.fila.eligiendo .colgante:not(.elegida){opacity:.22;transition:opacity .35s}
.carril{user-select:none;-webkit-user-select:none}
.carril.arrastrando{cursor:grabbing}
.carril img{-webkit-user-drag:none;user-drag:none}
@media (hover:hover){.carril{cursor:grab}}
/* C */

/* D */
body::before,.capa::before{animation:deriva 38s ease-in-out infinite alternate;will-change:transform}
body.dvd::before{animation-duration:24s}
body.polos::before,.polos .capa::before{animation-duration:55s}
@keyframes deriva{from{transform:translate3d(-1.4%,.6%,0) scale(1.06)}to{transform:translate3d(1.4%,-1%,0) scale(1.13)}}
.luz i{position:absolute;display:block}
.luz .l1{top:-25%;bottom:-25%;left:-50%;width:42%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5) 50%,transparent);transform:skewX(-14deg);filter:blur(18px);animation:barrido 15s ease-in-out infinite;animation-delay:2s}
@keyframes barrido{0%{translate:0 0;opacity:0}6%{opacity:1}34%{translate:360% 0;opacity:1}40%{translate:380% 0;opacity:0}100%{translate:380% 0;opacity:0}}
.luz .l2{left:-10%;right:-10%;bottom:-30%;height:75%;background:radial-gradient(55% 60% at 50% 100%,rgba(155,27,27,.36),transparent 72%);opacity:0}
body.dvd .luz .l1{width:30%;animation-duration:9s;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75) 50%,transparent)}
body.dvd .luz .l2{opacity:1;animation:pulso 4.8s ease-in-out infinite}
@keyframes pulso{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
body.polos .luz .l1{width:55%;animation-duration:22s;background:linear-gradient(100deg,transparent,rgba(255,232,180,.7) 50%,transparent)}
/* E: modo deslizar (horizontal) integrado a la pantalla principal */
.hist-vista{display:none;position:relative;flex:1;min-height:0;width:100%;container-type:size}
body.slides .hist-vista{display:block;animation:aparece .6s ease both}
body.slides .riel-wrap,body.slides .pie-escena,body.slides .fila-pills{display:none}
.riel-wrap.desv{opacity:0;transition:opacity .4s ease}
.h-scroll{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.h-scroll::-webkit-scrollbar{display:none}
.h-slide{flex:0 0 100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(5px,1.2vh,12px);padding:14px 16px 30px;text-align:center;position:relative}
.h-slide .percha{display:none}
.h-nom{margin:0;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:clamp(24px,3.4vw,38px);letter-spacing:.05em;text-transform:uppercase;line-height:1}
.h-nom small{display:block;margin-top:6px;font-family:var(--cuerpo);font-weight:400;font-stretch:100%;font-size:12px;letter-spacing:.2em;color:var(--texto2)}
.h-foto{width:min(88cqw,calc(100cqh - 200px),640px);cursor:default}
.h-foto .giro{width:100%}
.polos .h-foto{width:min(84cqw,calc((100cqh - 235px)*.558),400px)}
.h-pcol{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.h-espec[hidden]{display:none}
.h-datos{display:flex;align-items:center;justify-content:center;gap:clamp(14px,3vw,28px)}
.h-precio{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:clamp(40px,7.4vh,60px);line-height:1;letter-spacing:.01em}
.h-precio.sin{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--texto2);font-weight:600}
.h-g{padding-left:clamp(14px,3vw,28px);border-left:1.5px solid var(--linea);text-align:left}
.h-g small{display:block;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--texto2);line-height:1.2}
.h-g b{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:clamp(30px,5.4vh,44px);line-height:1;font-variant-numeric:tabular-nums}
.h-g b i{font-style:normal;font-size:.5em;margin-left:3px;letter-spacing:.08em}
.h-g em{display:block;margin-top:5px;height:5px;border-radius:3px;background:rgba(0,0,0,.15);overflow:hidden}
.h-g em u{display:block;height:100%;width:0;background:var(--carmin);border-radius:3px;transition:width 1s .2s cubic-bezier(.2,.8,.2,1)}
.vis .h-g em u{width:var(--w)}
.h-fila{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.h-cols{display:flex;gap:9px}
.h-cols button{width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(0,0,0,.45);padding:0}
.h-cols button[aria-pressed="true"]{outline:2px solid var(--negro);outline-offset:3px}
.h-ver{white-space:nowrap}
.h-sig{position:absolute;right:4px;top:42%;writing-mode:vertical-rl;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--texto2);animation:empuja 1.6s ease-in-out infinite}
@keyframes empuja{0%,100%{transform:translateX(0);opacity:.4}50%{transform:translateX(-7px);opacity:1}}
@keyframes flota{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-6px);opacity:1}}
.h-slide .h-foto,.h-slide .h-nom,.h-slide .h-datos,.h-slide .h-fila{opacity:0;transform:translateY(34px);transition:opacity .5s,transform .6s cubic-bezier(.2,.9,.25,1)}
.h-slide .h-foto{transform:translateY(60px) scale(.88);transition-duration:.7s}
.h-slide.vis .h-nom{opacity:1;transform:none}
.h-slide.vis .h-foto{opacity:1;transform:none;transition-delay:.08s}
.h-slide.vis .h-datos{opacity:1;transform:none;transition-delay:.2s}
.h-slide.vis .h-fila{opacity:1;transform:none;transition-delay:.3s}
.h-pos{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:9px;z-index:5}
.h-pos button{width:9px;height:9px;padding:0;border-radius:50%;border:1.5px solid var(--negro);background:none;transition:width .3s,background .3s}
.h-pos button.on{background:var(--negro);width:22px;border-radius:5px}
.h-flecha{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1.5px solid var(--negro);background:var(--blanco);font-size:18px;z-index:6;display:none}
.h-flecha.i{left:max(14px,env(safe-area-inset-left,0px))}.h-flecha.d{right:max(14px,env(safe-area-inset-right,0px))}
@media (min-width:700px){.h-flecha{display:block}}
@media (max-width:520px){.h-datos{gap:14px}}
@media (prefers-reduced-motion:reduce){
  body::before,.capa::before,.luz i,.h-sig{animation:none!important}
  .colgante{transition:none}
  .h-slide .h-foto,.h-slide .h-nom,.h-slide .h-datos,.h-slide .h-fila{opacity:1;transform:none;transition:none}
}

/* ---- v25: comparación de peso, sellos, stock ---- */
.e-comp{font-size:11.5px;color:var(--texto2);letter-spacing:.03em;text-align:center;margin-top:-2px}
.e-comp:empty{display:none}
.e-sellos{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:min(520px,calc(100vw - 32px))}
.e-sellos:empty{display:none}
.sello{display:inline-block;padding:5px 11px 4px;border:1.5px solid var(--negro);border-radius:999px;background:rgba(255,255,255,.75);font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;line-height:1.2}
.sello.st-ok{border-color:#1f7a3a;color:#1f7a3a}

.izq-s{justify-content:flex-start;margin:4px 0 8px}
.comp{margin:6px 0 10px;display:grid;gap:7px}
.comp .cb{display:grid;grid-template-columns:116px 1fr 52px;align-items:center;gap:10px;font-size:12px}

/* ---- v24: gramaje grande, ajuste a pantallas bajas, polos con aire ---- */
.e-fila{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;margin:2px 0 4px}
.e-fila .e-precio{margin:0}
.e-peso{display:flex;flex-direction:column;align-items:stretch;gap:4px;min-width:118px;padding-left:20px;border-left:1.5px solid var(--linea,#bbb)}

.e-peso .pv{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:clamp(24px,3.2vw,34px);line-height:1;letter-spacing:.02em}
.e-peso .pv small{font-size:.5em;letter-spacing:.08em;margin-left:2px}

let STOCK = null;
function stockDe(d,color,talla){ const p = STOCK && STOCK.prendas && STOCK.prendas[d.codigo]; const ck = (d.alias&&d.alias[color])||color; if(!p || !p[ck]) return null; const n = p[ck][talla]; return typeof n==="number" ? n : 0; }
function estadoStock(n){ return n===null ? "ok" : n<=0 ? "agotado" : n<=2 ? "ultimas" : "ok"; }
function prendaAgotada(d){ return d.colores.every(c=>tallasDe(d).every(t=>estadoStock(stockDe(d,c,t))==="agotado")); }
function cargarStock(){
  return fetch("stock.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{ STOCK=j; }).catch(()=>{ STOCK=null; });
}

/* ============ VISOR DE ZOOM ============ */
const Z = { s:1, x:0, y:0, p:new Map(), d0:0, prev:null, open:false, ret:null };
function zoomSrc(p){ return cb(p.replace("fotos_png/","zoom/").replace(/\.png$/,".webp").replace("fotos/","zoom/")); }
function srcLado(d, color, lado){ const f = d.fotos && d.fotos[color] && d.fotos[color][lado]; return f ? zoomSrc(f) : null; }
function zLimites(){
  const v=$("#z-vista"), im=$("#z-img"); const w=im.offsetWidth*Z.s, h=im.offsetHeight*Z.s;
  const mx=Math.max(0,(w-v.clientWidth)/2), my=Math.max(0,(h-v.clientHeight)/2);
  const cx=v.clientWidth/2, cy=v.clientHeight/2;
  return {mx,my,cx,cy,w:im.offsetWidth,h:im.offsetHeight};
}
function zAplicar(){
  const L=zLimites();
  Z.x=Math.min(L.mx,Math.max(-L.mx,Z.x)); Z.y=Math.min(L.my,Math.max(-L.my,Z.y));
  const im=$("#z-img");
  im.style.transform=`translate(${Z.x - L.w*Z.s/2}px,${Z.y - L.h*Z.s/2}px) scale(${Z.s})`;
}
function zEn(nuevo, px, py){            /* zoom alrededor de un punto (px,py relativos al centro) */
  nuevo=Math.min(6,Math.max(1,nuevo)); const k=nuevo/Z.s;
  Z.x = px - (px - Z.x)*k; Z.y = py - (py - Z.y)*k; Z.s=nuevo;
  if(Z.s===1){ Z.x=0; Z.y=0; }
  zAplicar();
}
function abrirZoom(src, alt){
  if(!src) return;
  Z.prev = document.activeElement; Z.s=1; Z.x=0; Z.y=0; Z.p.clear();
  const im=$("#z-img"); im.alt=alt||""; 
  const z=$("#zoom"); z.hidden=false; z.classList.add("abierta"); Z.open=true;
  im.onload=()=>zAplicar(); im.src=src; if(im.complete) zAplicar();
  $("#z-cerrar").focus();
}
function cerrarZoom(){
  const z=$("#zoom"); z.classList.remove("abierta"); z.hidden=true; Z.open=false; Z.p.clear();
  if(Z.prev && Z.prev.focus) try{ Z.prev.focus(); }catch(e){}
}
function iniciarZoom(){
  const v=$("#z-vista");
  const centro=(e)=>{ const r=v.getBoundingClientRect(); return [e.clientX-r.left-r.width/2, e.clientY-r.top-r.height/2]; };
  v.addEventListener("wheel", e=>{ e.preventDefault(); const [px,py]=centro(e); zEn(Z.s*Math.exp(-e.deltaY*0.0018), px, py); }, {passive:false});
  v.addEventListener("pointerdown", e=>{ v.setPointerCapture(e.pointerId); Z.p.set(e.pointerId,[e.clientX,e.clientY]); if(Z.p.size===2){ const a=[...Z.p.values()]; Z.d0=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]); } });
  v.addEventListener("pointermove", e=>{
    if(!Z.p.has(e.pointerId)) return;
    const ant=Z.p.get(e.pointerId); Z.p.set(e.pointerId,[e.clientX,e.clientY]);
    if(Z.p.size===1){ if(Z.s>1){ Z.x+=e.clientX-ant[0]; Z.y+=e.clientY-ant[1]; zAplicar(); } }
    else if(Z.p.size===2){
      const a=[...Z.p.values()]; const d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);
      const r=v.getBoundingClientRect(); const mx=(a[0][0]+a[1][0])/2-r.left-r.width/2, my=(a[0][1]+a[1][1])/2-r.top-r.height/2;
      if(Z.d0>0) zEn(Z.s*d/Z.d0, mx, my); Z.d0=d;
    }
  });
  const fin=e=>{ Z.p.delete(e.pointerId); Z.d0=0; };
  v.addEventListener("pointerup",fin); v.addEventListener("pointercancel",fin);
  v.addEventListener("dblclick", e=>{ const [px,py]=centro(e); if(Z.s>1.05) zEn(1,0,0); else zEn(2.6,px,py); });
  $("#z-mas").addEventListener("click",()=>zEn(Z.s*1.4,0,0));
  $("#z-menos").addEventListener("click",()=>zEn(Z.s/1.4,0,0));
  $("#z-reset").addEventListener("click",()=>zEn(1,0,0));
  $("#z-cerrar").addEventListener("click",cerrarZoom);
  window.addEventListener("resize",()=>{ if(Z.open) zAplicar(); });
}

function actualizarFicha(){
  const d = E.ficha; if(!d) return;
  document.querySelectorAll("#f-tallas .op").forEach(b=>{

function copiar(texto, destino){
  const ok=()=>{destino.textContent="Mensaje copiado.";setTimeout(()=>destino.textContent="",2200)};
  const falla=()=>{destino.textContent="No se pudo copiar. Copia este texto: "+texto.replace(/\n/g," ")};
  try{ navigator.clipboard.writeText(texto).then(ok,falla); }catch(e){ falla(); }
}

function totalPedido(){ return E.pedido.reduce((s,i)=>s+(pc(byId(i.id),i.color)||0)*i.cant,0); }
function hayPorConfirmar(){ return E.pedido.some(i=>!byId(i.id).precio); }
function totTxt(){ const t=totalPedido(), x=hayPorConfirmar(); return t&&x ? precio(t)+" + por confirmar" : x ? "precio por confirmar" : precio(t); }
function msgPedido(){
  const l = E.pedido.map(i=>{const d=byId(i.id);return `• ${nom(d)} (${detTxt(d,i.color)}) · talla ${i.talla} · x${i.cant}${lineaPr(d,i.cant,i.color)}\n  Ver la prenda: ${enlacePrenda(d,i.color)}`});
  return `Hola, quiero pedir en CUATROCIENTOS:\n${l.join("\n")}\n\nTotal: ${totTxt()}\n¿Está disponible?`;
}
function pintarPedido(){
  const n = E.pedido.reduce((s,i)=>s+i.cant,0);
  $("#bp").classList.toggle("visible", n>0);
  $("#bp-ver").textContent = `Mi pedido · ${n} ${n===1?"prenda":"prendas"} · ${totTxt()}`;
  $("#bp-wa").href = n ? waLink(msgPedido()) : "#";
  $("#lista-in").innerHTML = E.pedido.map((i,k)=>{const d=byId(i.id);return `<div class="item"><span>${nom(d)} · ${i.color}${d.g?" · "+d.g+" g":""} · talla ${i.talla} · x${i.cant}</span><button type="button" data-q="${k}">Quitar</button></div>`}).join("");
  if(!n){ $("#lista").hidden=true; $("#bp-ver").setAttribute("aria-expanded","false"); }
}
function agregar(){
  const d=E.ficha; if(!d||!E.talla) return;
  const ex=E.pedido.find(i=>i.id===d.id&&i.talla===E.talla&&i.color===E.colorF);
  if(ex) ex.cant+=E.cant; else E.pedido.push({id:d.id,color:E.colorF,talla:E.talla,cant:E.cant});
  pintarPedido();
  $("#f-msg").textContent="Agregado a tu pedido.";
  setTimeout(()=>{const m=$("#f-msg"); if(m) m.textContent=""},2200);
}

/* ============ INICIO ============ */
let introT=[], introOn=false;
let tourOn=false; const TOUR={};
function limpiarTour(){ document.querySelectorAll("#fila .colgante").forEach(c=>c.classList.remove("lit")); $("#fila").classList.remove("luces","alba"); document.querySelectorAll("#fila .funda,#fila .gbar").forEach(x=>x.remove()); document.querySelectorAll("#fila .gr em[data-g]").forEach(e=>{ e.textContent=e.dataset.g; }); document.querySelectorAll("#fila .colgante.listo").forEach(c=>c.classList.remove("listo")); const h=$("#haz"); if(h){ h.classList.remove("on"); h.style.transform=""; } if(window.__rafD){ cancelAnimationFrame(window.__rafD); window.__rafD=0; } }
function cancelarIntro(sinSlides){
  introT.forEach(clearTimeout); introT=[]; introOn=false;
  if(tourOn){ tourOn=false; limpiarTour(); if(sinSlides!==true) mostrarSlides(); }
}
/* desfile de luz: el riel arranca en penumbra, un haz recorre las perchas de izquierda a derecha y cada prenda se enciende con su nombre y precio */
function ponerFundas(){
  const f=$("#fila"); f.classList.add("luces");
  [...f.children].forEach(el=>{ if(el.querySelector(".funda")) return; const lp=el.querySelector(".leg-p"); const d=document.createElement("i"); d.className="funda"; d.style.height=Math.max(60,(lp?lp.offsetTop:el.offsetHeight)+6)+"px"; d.innerHTML='<span class="fl"><img src="./marca_icono_blanco.png" alt=""><img src="./marca_palabra_blanco.png" alt=""></span>'; el.appendChild(d); });
}
function pesar(el){
  const em=el.querySelector(".gr em"), gr=el.querySelector(".gr");
  if(!em||!gr){ setTimeout(()=>el.classList.add("listo"),900); return; }
  const g=+em.textContent||0; em.dataset.g=g; em.textContent="0";
  const bar=document.createElement("i"); bar.className="gbar"; bar.innerHTML="<u></u>"; gr.after(bar);
  const u=bar.firstChild, t0=performance.now()+120, D=900;
  const paso=t=>{
    if(!tourOn||!bar.isConnected) return;
    const p=Math.max(0,Math.min(1,(t-t0)/D)), e=1-Math.pow(1-p,3);
    em.textContent=Math.round(g*e); u.style.width=(g/400*100*e)+"%";
    if(p<1) requestAnimationFrame(paso); else { em.textContent=g; el.classList.add("listo"); }
  };
  requestAnimationFrame(paso);
}
function tourSeccion(fin){
  const f=$("#fila"), c=$("#carril"), kids=[...f.children], n=kids.length;
  const rd=matchMedia("(prefers-reduced-motion:reduce)").matches;
  ponerFundas(); c.scrollLeft=0;
  if(rd){ kids.forEach(k=>{ k.classList.add("lit"); const fu=k.querySelector(".funda"); if(fu) fu.remove(); }); introT.push(setTimeout(()=>{ if(!tourOn) return; tourOn=false; limpiarTour(); fin(); },1000)); return; }
  /* 1) amanecer: la sala se ilumina tenue con las prendas aun en su funda; 2) las fundas de lavanderia se levantan una a una y descubren prenda, nombre y precio */
  introT.push(setTimeout(()=>{ if(!tourOn) return; f.classList.add("alba"); },250));
  /* todas las prendas tienen exactamente el mismo ciclo: llegada (0,6 s) + funda que sube y gramaje (3,4 s). Si el riel se desplaza, cada una espera su turno completo */
  const max=c.scrollWidth-c.clientWidth, desp=max>8, tB=1000, slot=desp?2000:800, PRE=250, CICLO=2500;
  kids.forEach((el,i)=>{
    introT.push(setTimeout(()=>{
      if(!tourOn) return;
      const tgt=Math.max(0,Math.min(max,el.offsetLeft+el.offsetWidth/2-c.clientWidth/2));
      if(Math.abs(tgt-c.scrollLeft)>2) c.scrollTo({left:tgt,behavior:"smooth"});
    },tB+i*slot));
    introT.push(setTimeout(()=>{
      if(!tourOn) return;
      const fu=el.querySelector(".funda"); if(fu) fu.classList.add("sube");
      el.classList.add("lit"); leyenda(i);
      pesar(el);
    },tB+i*slot+PRE));
  });
  const tF=tB+(n-1)*slot+PRE+1700;
  introT.push(setTimeout(()=>{ if(!tourOn) return; leyenda(-1); },tF));
  introT.push(setTimeout(()=>{ if(!tourOn) return; tourOn=false; $(".riel-wrap").classList.add("desv"); },tF+600));
  introT.push(setTimeout(()=>{ $(".riel-wrap").classList.remove("desv"); limpiarTour(); fin(); },tF+900));
}
function iniciarTourSec(s){
  TOUR[s]=true; mostrarRiel(); tourOn=true;
  tourSeccion(()=>{ leyenda(-1); mostrarSlides(); });
}
function recorrido(){
  const c=$("#carril"), max=c.scrollWidth-c.clientWidth;
  if(max<8 || matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const t0=performance.now(), dur=1500;
  const paso=t=>{ if(!introOn) return; const p=Math.min(1,(t-t0)/dur); const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2; c.scrollLeft = max*(p<.5? e*2 : 2-e*2)/1; if(p<1) requestAnimationFrame(paso); else c.scrollLeft=0; };
  requestAnimationFrame(paso);
}
function entrar(sin){
  const b=$("#bienvenida"); if(b.classList.contains("sale")) return;
  b.classList.add("sale"); $("#app").classList.remove("fuera");
  let visto=false; try{ visto = sessionStorage.getItem("c400-visto")==="1"; sessionStorage.setItem("c400-visto","1"); }catch(e){}
  setTimeout(()=>{ b.hidden=true; },1400);
  if(SEC==="polos"){ TOUR.polos=true; mostrarSlides(); return; }
  if(sin===true || visto || TOUR[SEC]){ TOUR[SEC]=true; mostrarSlides(); return; }
  if(!matchMedia("(prefers-reduced-motion:reduce)").matches) ponerFundas();
  setTimeout(()=>{ if(!tourOn && !E.abierto && !panelAbierto() && !TOUR.camisetas) iniciarTourSec("camisetas"); },1000);
}
/* ============ MODO DESLIZAR (horizontal) ============ */
let HIO=null;
function mostrarRiel(){ document.body.classList.remove("slides"); if(HIO){ HIO.disconnect(); HIO=null; } }
const hEsp=(d,c)=>espDe(d,c)?"★ Camiseta especial":(hayEsp(d)?"★ Con versión especial":"");
function mostrarSlides(){
  if(!VARS.length) return;
  document.body.classList.add("slides");
  const sc=$("#h-scroll");
  sc.innerHTML = VARS.map((v,i)=>{ const d=v.d; return `
    <article class="h-slide" data-i="${i}">
      <h3 class="h-nom">${d.nombre}<small>${[codTxt(d), d.insig, (d.colores.length>1||d.tipo==="polo")?v.color:""].filter(Boolean).join(" · ")}</small></h3>
      <div class="h-foto" data-i="${i}">${giro(d, v.color, false, false, true)}</div>
      <div class="h-datos">
        <div class="h-pcol"><div class="h-precio${d.precio?"":" sin"}">${prTxt(d, d.colores.length>1?v.color:"")}</div><div class="h-espec"${hEsp(d,v.color)?"":" hidden"}>${hEsp(d,v.color)}</div></div>
        ${d.g?`<div class="h-g"><small>Gramaje</small><b data-g="${d.g}">${d.g}<i>g</i></b><em><u style="--w:${Math.round(d.g/400*100)}%"></u></em></div>`:""}
      </div>
      <div class="h-fila">
        ${d.colores.length>1?`<div class="h-cols" role="group" aria-label="Color">${d.colores.map(co=>`<button type="button" data-i="${i}" data-c="${co}" aria-label="${co}" aria-pressed="${co===v.color}" style="background:${COLORES[co].hex}"></button>`).join("")}</div>`:""}
        <button type="button" class="pill solido h-ver" data-i="${i}">Ver prenda</button>
        <span class="h-br" aria-hidden="true"></span>
        <button type="button" class="pill h-esp" data-i="${i}">Ver espalda</button>
      </div>
      ${i===0&&VARS.length>1?`<span class="h-sig">Desliza →</span>`:""}
    </article>`; }).join("");
  $("#h-pos").innerHTML = VARS.map((v,i)=>`<button type="button" data-i="${i}" aria-label="${v.d.nombre}"></button>`).join("");
  sc.scrollLeft = 0;
  if(HIO) HIO.disconnect();
  HIO = new IntersectionObserver(es=>es.forEach(en=>{
    const sl=en.target, i=+sl.dataset.i;
    if(en.isIntersecting && en.intersectionRatio>=.55){
      sl.classList.add("vis");
      document.querySelectorAll("#h-pos button").forEach((b,k)=>b.classList.toggle("on",k===i));
      const b=sl.querySelector(".h-g b"); if(b && !b.dataset.hecho){ b.dataset.hecho="1"; contar(b); }
      const sg=document.querySelector(".h-sig"); if(sg && i>0) sg.remove();
    }
  }),{root:sc,threshold:[.55]});
  sc.querySelectorAll(".h-slide").forEach(x=>HIO.observe(x));
}
function irSlide(dir){ const sc=$("#h-scroll"); sc.scrollBy({left:dir*sc.clientWidth,behavior:"smooth"}); }
function sincronizarSlides(){ if(!document.body.classList.contains("slides")) return; const sc=$("#h-scroll"); sc.scrollTo({left:E.idx*sc.clientWidth,behavior:"instant"}); }
function contar(b){
  const g=+b.dataset.g, u=b.querySelector("i").outerHTML; if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const t0=performance.now(), D=900;
  const f=t=>{ const p=Math.min(1,(t-t0)/D), e=1-Math.pow(1-p,3); b.innerHTML=Math.round(g*e)+u; if(p<1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}
function iniciar(){
  const una = CONFIG.frase.map(f=>`<span>${f} ·</span>`).join("");
  $("#franja").innerHTML = una+una+una+una;
  pintarRiel(); pintarPedido(); cargarStock().then(()=>{ if(E.ficha) actualizarFicha(); if(E.abierto==="enfoque" && VARS[E.idx]) pintarPrecioE(VARS[E.idx].d); });

  let arrastre=false;
  const reduce = () => matchMedia("(prefers-reduced-motion:reduce)").matches;
  $("#fila").addEventListener("click", e=>{
    const b=e.target.closest(".colgante"); if(!b) return;
    if(arrastre){ arrastre=false; return; }
    const i=+b.dataset.i; if(reduce() || b.classList.contains("elegida")){ if(!b.classList.contains("elegida")) abrirEnfoque(i); return; }
    $("#fila").classList.add("eligiendo"); b.classList.add("elegida");
    setTimeout(()=>{ abrirEnfoque(i); setTimeout(()=>{ b.classList.remove("elegida"); $("#fila").classList.remove("eligiendo"); },500); },430);
  });
  (function(){
    const c=$("#carril"), f=$("#fila"); let down=false,sx=0,sl=0,lx=0,lt=0,vx=0,moved=false,raf=0;
    c.addEventListener("pointerdown",e=>{ if(e.pointerType!=="mouse"||e.button!==0) return; down=true; moved=false; sx=lx=e.clientX; sl=c.scrollLeft; lt=performance.now(); vx=0; cancelAnimationFrame(raf); });
    window.addEventListener("pointermove",e=>{ if(!down) return; const dx=e.clientX-sx; if(!moved){ if(Math.abs(dx)<6) return; moved=true; c.style.scrollSnapType="none"; c.classList.add("arrastrando"); } const t=performance.now(); vx=(e.clientX-lx)/Math.max(1,t-lt); lx=e.clientX; lt=t; c.scrollLeft=sl-dx; });
    window.addEventListener("pointerup",()=>{ if(!down) return; down=false; if(!moved) return; arrastre=true; setTimeout(()=>{arrastre=false;},80); c.classList.remove("arrastrando"); let v=-vx*16; const paso=()=>{ c.scrollLeft+=v; v*=.94; if(Math.abs(v)>.4) raf=requestAnimationFrame(paso); else c.style.scrollSnapType=""; }; paso(); });
    let ult=c.scrollLeft, idle=0;
    c.addEventListener("scroll",()=>{ const dx=c.scrollLeft-ult; ult=c.scrollLeft; const v=Math.max(-9,Math.min(9,-dx*.45)); f.style.setProperty("--vel",v.toFixed(2)); clearTimeout(idle); idle=setTimeout(()=>f.style.setProperty("--vel",0),70); },{passive:true});
  })();
  $("#fila").addEventListener("mouseover", e=>{ const b=e.target.closest(".colgante"); if(b) leyenda(+b.dataset.i); });
  $("#fila").addEventListener("focusin", e=>{ const b=e.target.closest(".colgante"); if(b) leyenda(+b.dataset.i); });
  $("#fila").addEventListener("mouseleave", ()=>leyenda(-1));
  $("#b-ver").addEventListener("click", ()=>abrirEnfoque(0));
  $("#b-nosotros").addEventListener("click", nosotros);
  $("#tabs-sec").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; if(b.dataset.s==="promos"){ abrirPromos(); return; } if(b.dataset.s!==SEC) ponerSeccion(b.dataset.s); });
  $("#e-colores").addEventListener("click", e=>{ const b=e.target.closest("button"); if(b) cambiarColorE(b.dataset.c); });
  $("#b-contacto").addEventListener("click", contacto);
  $("#b-entrar").addEventListener("click", entrar);
  $("#h-ant").addEventListener("click", ()=>irSlide(-1));
  $("#h-sig").addEventListener("click", ()=>irSlide(1));
  $("#h-pos").addEventListener("click", e=>{ const b=e.target.closest("button"); if(b){ const sc=$("#h-scroll"); sc.scrollTo({left:(+b.dataset.i)*sc.clientWidth,behavior:"smooth"}); } });
  ["pointerdown","keydown","wheel","touchstart"].forEach(ev=>document.addEventListener(ev,()=>{ if(tourOn) cancelarIntro(); },{passive:true}));
  $("#h-scroll").addEventListener("click", e=>{
    const col=e.target.closest(".h-cols button");
    if(col){ const i=+col.dataset.i, v=VARS[i]; v.color=col.dataset.c; const sl=col.closest(".h-slide"); sl.querySelector(".h-foto").innerHTML=giro(v.d, v.color, false, false, true); sl.querySelectorAll(".h-cols button").forEach(b=>b.setAttribute("aria-pressed", b===col)); sl.querySelector(".h-nom small").textContent=[codTxt(v.d), v.d.insig, v.color].filter(Boolean).join(" · "); sl.querySelector(".h-precio").textContent=prTxt(v.d,v.color); const he=sl.querySelector(".h-espec"); he.textContent=hEsp(v.d,v.color); he.hidden=!he.textContent; return; }
    const ver=e.target.closest(".h-ver"); if(ver){ const v=VARS[+ver.dataset.i]; abrirEnfoque(+ver.dataset.i,false,v.color); return; }
    const esp=e.target.closest(".h-esp"); if(esp){ const sl=esp.closest(".h-slide"), g=sl.querySelector(".giro"); if(g){ g.classList.toggle("vuelta"); esp.textContent = g.classList.contains("vuelta") ? "Ver frente" : "Ver espalda"; } return; }
    const ft=e.target.closest(".h-foto"); if(ft){ const g=ft.querySelector(".giro"); if(g) g.classList.toggle("vuelta"); const e2=ft.closest(".h-slide").querySelector(".h-esp"); if(e2&&g) e2.textContent = g.classList.contains("vuelta") ? "Ver frente" : "Ver espalda"; }
  });
  $("#bienvenida").addEventListener("click", e=>{ if(e.target.id==="bienvenida") entrar(); });
  let visto=false; try{ visto = sessionStorage.getItem("c400-visto")==="1"; }catch(e){}
  if(visto) entrar(); else setTimeout(entrar, 4700);

  $("#e-cerrar").addEventListener("click", cerrarEnfoque);
  $("#e-ant").addEventListener("click", ()=>irFoto(-1));
  $("#e-sig").addEventListener("click", ()=>irFoto(1));
  $("#e-frente").addEventListener("click", ()=>lado(false));
  $("#e-espalda").addEventListener("click", ()=>lado(true));
  $("#e-detalles").addEventListener("click", ()=>{ const S=slidesDe(VARS[E.idx].d,E.color), k=S.findIndex(x=>x.k==="d"); if(k<0) return; const dir=k>E.s?1:-1; E.s=k; E.di=0; pintarFoco(dir); });
  deslizable($("#foco"), irFoto);
  $("#e-pts").addEventListener("click", e=>{ const b=e.target.closest("[data-s]"); if(!b) return; const k=+b.dataset.s, dir=k>E.s?1:-1; E.s=k; E.di=0; pintarFoco(dir); });
  $("#foco").addEventListener("click", e=>{
    const th=e.target.closest(".det-th"); if(th){ E.di=+th.dataset.k; pintarFoco(0); return; }
    const z=e.target.closest(".det"); if(z){ abrirZoom(z.dataset.zoom, VARS[E.idx].d.nombre); return; }
    if(e.target.closest(".giro")) zoomActual();
  });
  $("#foco").addEventListener("keydown", e=>{ const z=e.target.closest(".det"); if(z && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); abrirZoom(z.dataset.zoom,"Detalle"); } });
  $("#e-zoom").addEventListener("click", zoomActual);
  iniciarZoom();
  $("#e-disp").addEventListener("click", ()=>abrirFicha(VARS[E.idx].d.id, E.color));

  $("#ficha").addEventListener("click", e=>{
    if(e.target.closest("#f-cerrar")) return cerrarFicha();
    const t=e.target.closest("#f-tallas .op"); if(t){ E.talla=t.dataset.t; return actualizarFicha(); }
    const c=e.target.closest("#f-colores .op"); if(c){
      E.fsPrev=slidesDe(E.ficha,E.colorF)[E.fs]; E.colorF=c.dataset.c;
      return pintarFichaCambioColor();
    }
    const th=e.target.closest("#f-giro .det-th"); if(th){ E.fdi=+th.dataset.k; pintarFichaVista(0); return; }
    const pf=e.target.closest("#f-pts [data-s]"); if(pf){ const k=+pf.dataset.s, dir=k>E.fs?1:-1; E.fs=k; E.fdi=0; pintarFichaVista(dir); return; }
    const zz=e.target.closest("#f-giro .det"); if(zz){ abrirZoom(zz.dataset.zoom,E.ficha.nombre); return; }
    if(e.target.closest("#f-zoom")) return zoomFicha();
    if(e.target.closest("#f-giro .giro")) return zoomFicha();
    const l=e.target.closest(".ficha-img .seg button"); if(l){
      const S=slidesDe(E.ficha,E.colorF), k=S.findIndex(x=> l.dataset.l==="d" ? x.k==="d" : (x.k==="g" && x.v===(l.dataset.l==="e")));
      if(k<0) return; const dir=k>E.fs?1:-1; E.fs=k; E.fdi=0; pintarFichaVista(dir); return;
    }
    if(e.target.closest("#f-menos")){ E.cant=Math.max(1,E.cant-1); return actualizarFicha(); }
    if(e.target.closest("#f-mas")){ E.cant=Math.min(20,E.cant+1); return actualizarFicha(); }
    if(e.target.closest("#f-add")) return agregar();
    if(e.target.closest("#f-copiar") && E.talla) return copiar(msgUno(E.ficha,E.colorF,E.talla,E.cant), $("#f-msg"));
  });
  $("#panel").addEventListener("click", e=>{ if(e.target.closest("#p-x")) cerrarPanel(); });
  $("#vel").addEventListener("click", cerrarPanel);
  $("#bp-ver").addEventListener("click", ()=>{ const l=$("#lista"); l.hidden=!l.hidden; $("#bp-ver").setAttribute("aria-expanded", !l.hidden); });
  $("#lista-in").addEventListener("click", e=>{ const q=e.target.closest("[data-q]"); if(q){ E.pedido.splice(+q.dataset.q,1); pintarPedido(); } });

  document.addEventListener("keydown", e=>{
    if(Z.open){ if(e.key==="Escape") cerrarZoom(); else if(e.key==="+"||e.key==="=") zEn(Z.s*1.4,0,0); else if(e.key==="-") zEn(Z.s/1.4,0,0); else if(e.key==="0") zEn(1,0,0); return; }
    if(e.key==="Escape"){ if(panelAbierto()) cerrarPanel(); else if($("#ficha").classList.contains("abierta")) cerrarFicha(); else cerrarEnfoque(); }
    if(document.body.classList.contains("slides") && !$("#enfoque").classList.contains("abierta") && !$("#ficha").classList.contains("abierta") && !panelAbierto() && (e.key==="ArrowRight"||e.key==="ArrowLeft")){ e.preventDefault(); irSlide(e.key==="ArrowRight"?1:-1); }
    if($("#enfoque").classList.contains("abierta") && !$("#ficha").classList.contains("abierta") && !panelAbierto()){
      if(e.key==="ArrowRight") irFoto(1); if(e.key==="ArrowLeft") irFoto(-1);
    }
  });
  const h = location.hash;
  if(h==="#polos"){ ponerSeccion("polos",true); entrar(true); }
  if(h==="#dvd"){ ponerSeccion("dvd",true); entrar(true); }
  if(h.startsWith("#historias")){ const k=h.slice(11); if(k==="dvd"||k==="polos") ponerSeccion(k,true); entrar(true); }
  if(h.startsWith("#producto-")){
    const k=h.slice(10); const t=TODOS.find(d=>k===d.id||k.startsWith(d.id+"-"));
    if(t){ ponerSeccion(t.sec||"camisetas",true); const cs=k.slice(t.id.length+1); const col=t.colores.find(c=>slug(c)===cs); const i=VARS.findIndex(v=>v.d.id===t.id); entrar(true); abrirEnfoque(i,true,col); }
  }
  if(h.startsWith("#ficha-")){ const d=byId(h.slice(7)); if(d){ ponerSeccion(d.sec||"camisetas",true); entrar(true); abrirFicha(d.id,null,true); } }
}
iniciar();
</script>
